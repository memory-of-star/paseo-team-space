services:
  team:
    build: .
    restart: unless-stopped
    environment:
      TEAM_BOOTSTRAP_TOKEN: ${TEAM_BOOTSTRAP_TOKEN:?Set TEAM_BOOTSTRAP_TOKEN before starting}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - team-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  team-data:
